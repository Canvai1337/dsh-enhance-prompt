# Example: override this plugin's row config in your profile's cordis.patch.yml.
# The row id is `enhance-prompt` (see cordis.patch.yml); a matching entry here
# replaces the complete config for that row.
- id: enhance-prompt
  name: dsh-enhance-prompt
  config:
    # true = sectioned output (labels + lists); false = one paragraph
    structured: true
    # Cheapest effort is usually enough for a rewrite (off / low / high / max).
    # Leave it out when the selected model does not expose reasoning efforts.
    # reasoningEffort: low
    # Optional: run enhancement on a specific, cheaper model
    # provider: magpie
    # model: auto/deepseek-v4.1-flash
    # Draft and output bounds
    maxInputChars: 32000
    maxOutputTokens: 4096
    timeoutMs: 75000
    # Empty omits `temperature` entirely, which reasoning models often require.
    # Set a number (0-2) only for providers that accept it on this model.
    temperature: ''
    # Fully custom system prompt (overrides the built-in one)
    # system: |
    #   You are a prompt rewriter...
